services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerotwin-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerotwin-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
